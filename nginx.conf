# ============================================================================
# nginx.conf — настройки веб-сервера для pati-designer.ru
#
# Сайт работает в Dokploy: сервер собирается по Dockerfile из этой же папки,
# а HTTPS, сертификат и переадресации (http → https, www → без www) делает
# Traefik в Dokploy. Поэтому здесь только порт 80 и раздача файлов.
#
# Исходник лежит в deploy/ проекта, копия — в корне publish/ (и репозитория).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # не показывать версию nginx в ответах и на страницах ошибок
    server_tokens off;

    # В переадресациях писать относительный адрес («/»), а не «http://домен/»:
    # nginx за Traefik видит только http, и посетитель прыгал бы http → https лишний раз.
    absolute_redirect off;

    # У главной один адрес: /index.html → / (301). Иначе Google видит дубль
    # «Вариант страницы с тегом canonical». Ссылки index.html#… в страницах
    # остаются (они нужны при открытии файлов локально), якорь браузер сохранит.
    # Проверяем $request_uri — исходный адрес запроса: на «/» nginx сам внутренне
    # подставляет /index.html, и правило через location зациклило бы главную.
    if ($request_uri ~ "^/index\.html(\?|$)") {
        return 301 /$is_args$args;
    }

    # Своя страница «не найдено». Ради неё и заведён этот файл:
    # стандартный nginx показывает серую «404 Not Found».
    error_page 404 /404.html;

    # Сжатие текстовых файлов: страницы, стили и скрипты грузятся быстрее.
    # HTML сжимается всегда, остальные типы перечислены явно.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/plain application/xml image/svg+xml;

    # Базовые заголовки безопасности. always — чтобы они были и на странице 404.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Служебные файлы с точкой в начале имени (.git и т.п.) не отдаём никогда.
    # Этот блок должен идти первым среди блоков с ~: nginx проверяет их по порядку.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Картинки и шрифты меняются редко — браузер хранит их месяц.
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Стили и скрипты — час: имена файлов при правках не меняются,
    # поэтому долгий кэш показал бы посетителям старую версию.
    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Страницы браузер каждый раз сверяет с сервером — правки видны сразу.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }
}
