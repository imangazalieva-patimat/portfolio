<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!--
    Корень сайта определяется на лету. 404 отдаётся по любому адресу,
    в том числе вложенному (/кейсы/чего-то-нет), и относительные пути
    с такой глубины ломаются. Скрипт ставит <base>, и дальше все ссылки
    на странице считаются от корня сайта:
      GitHub Pages в подпапке — /portfolio/
      свой домен или локальный сервер — /
      открытый файл с диска — папка рядом с файлом
    Скрипт стоит первым в head: он должен отработать раньше,
    чем браузер начнёт грузить шрифт, иконки и картинку.
  -->
  <script>
    (function () {
      var path = location.pathname;
      var base;

      if (/404\.html$/.test(path)) {
        /* страницу открыли напрямую (проверка, предпросмотр publish) —
           корень сайта это папка, где лежит сам файл */
        base = path.replace(/404\.html$/, "");
      } else if (path.indexOf("/portfolio/") === 0) {
        /* GitHub Pages: сайт в подпапке репозитория */
        base = "/portfolio/";
      } else {
        /* свой домен или локальный сервер: сайт в корне */
        base = "/";
      }

      document.write('<base href="' + base + '">');
    })();
  </script>

  <title>Страница не найдена — Pati Designer</title>
  <meta name="description" content="Такой страницы на сайте нет. Кейсы и контакты на месте.">
  <meta name="robots" content="noindex">

  <!-- Иконка сайта -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!--
    Стили этой страницы — внутри файла, а не в css/.
    Причина: 404 отдаётся по любому адресу, в том числе вложенному
    (/кейсы/чего-то-нет). Относительные пути с такой глубины ломаются.
  -->
  <style>
    /* Шрифт — тот же локальный Montserrat, что на остальных страницах.
       Здесь хватает двух наборов символов: кириллица и латиница. */
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('fonts/montserrat/montserrat-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Montserrat';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('fonts/montserrat/montserrat-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    *{ box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fcfcfc;
      --ink: #1e1e1e;
      --muted: rgba(30, 30, 30, 0.6);
      --accent: #b3a1d1;
      --btn-dark: #464646;
      --btn-light: #f2f2f2;
    }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) clamp(20px, 5vw, 48px) max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--ink);
      font-family: 'Montserrat', sans-serif;
    }

    /* Две колонки: слева картинка, справа текст */
    .wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: clamp(24px, 5vw, 72px);
      width: 100%;
      max-width: 1080px;
    }

    /* Лупа ходит по макету, будто ищет страницу */
    .pic img {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: 70% 70%;
      animation: search 4s ease-in-out infinite;
    }
    @keyframes search {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      30%      { transform: translate(-14px, -8px) rotate(-2deg); }
      65%      { transform: translate(10px, -4px) rotate(1.5deg); }
    }

    .eyebrow {
      margin-bottom: 14px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin-bottom: 16px;
      font-size: clamp(30px, 4vw, 48px);
      font-weight: 500;
      line-height: 1.15;
    }
    .text {
      margin-bottom: 28px;
      max-width: 520px;
      font-size: clamp(17px, 1.8vw, 22px);
      line-height: 1.5;
      color: var(--muted);
      /* без одинокого слова в последней строке */
      text-wrap: pretty;
    }

    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 26px;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.25s ease;
    }
    .btn--dark { background: var(--btn-dark); color: #fff; }
    .btn--light { background: var(--btn-light); color: var(--ink); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    @media (hover: hover) {
      .btn:hover { transform: translateY(-3px); }
    }

    /* ===== Адаптив ===== */

    /* до 767px — один столбец: картинка сверху, текст под ней */
    @media (max-width: 767px) {
      .wrap { grid-template-columns: 1fr; text-align: center; }
      .pic { max-width: 320px; margin: 0 auto; }
      .text { margin-inline: auto; }
      h1 { text-wrap: balance; }
      .actions { justify-content: center; }
    }

    @media (max-width: 639px) {
      .pic { max-width: 280px; }
      .actions { flex-direction: column; width: 100%; }
      .btn { width: 100%; }
    }

    /* телефон горизонтально: снова две колонки, всё компактнее */
    @media (max-height: 520px) and (orientation: landscape) {
      .wrap { grid-template-columns: 1fr 1fr; text-align: left; gap: 24px; }
      .pic { max-width: 300px; margin: 0; }
      .text { margin-inline: 0; margin-bottom: 18px; font-size: 16px; }
      h1 { font-size: clamp(22px, 4.5vw, 30px); margin-bottom: 10px; }
      .eyebrow { margin-bottom: 8px; font-size: 13px; }
      .actions { flex-direction: row; width: auto; justify-content: flex-start; }
      .btn { width: auto; min-height: 44px; padding: 0 20px; font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pic img { animation: none; }
    }
  </style>
</head>
<body>

  <main class="wrap">

    <div class="pic">
      <img src="images/hero-illustration.webp"
           alt="Иллюстрация: рука с лупой рассматривает интерфейс с графиками" width="1120" height="1120">
    </div>

    <div class="copy">
      <p class="eyebrow">Ошибка 404</p>
      <h1>Ищу эту страницу… но&nbsp;её&nbsp;здесь нет</h1>
      <p class="text">Страницы, которую ты&nbsp;искал, всё равно нет&nbsp;— но&nbsp;на&nbsp;главной есть все работы.</p>
      <div class="actions">
        <a class="btn btn--dark" href="index.html">На главную</a>
        <a class="btn btn--light" href="index.html#contacts">Написать мне</a>
      </div>
    </div>

  </main>

</body>
</html>
